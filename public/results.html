<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Results - Japan Night Teer Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f5f0eb;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }

        .site-header {
            background: linear-gradient(90deg, #1a8fa0 0%, #16b0c8 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .site-header .logo-icon {
            width: 44px; height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            text-decoration: none;
        }
        .site-header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 1px;
            margin: 0;
        }
        .site-header a { text-decoration: none; color: #fff; }

        .page-content {
            padding: 20px 12px 30px;
            max-width: 960px;
            margin: 0 auto;
        }

        .results-table-wrapper {
            background: #fff;
            border: 2px solid #555;
            border-radius: 4px;
            overflow: hidden;
        }

        .results-title-row {
            background: #fff;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #111;
            padding: 8px 4px;
            border-bottom: 1px solid #888;
            letter-spacing: 2px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Roboto', sans-serif;
            table-layout: fixed;
        }

        .results-table th,
        .results-table td {
            border: 1px solid #aaa;
            text-align: center;
            padding: 7px 4px;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .results-table thead th {
            background: #16b0c8;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-color: #888;
        }

        .results-table th:nth-child(1),
        .results-table td:nth-child(1) { width: 30%; }
        .results-table th:nth-child(2),
        .results-table td:nth-child(2) { width: 40%; }
        .results-table th:nth-child(3),
        .results-table td:nth-child(3) { width: 15%; }
        .results-table th:nth-child(4),
        .results-table td:nth-child(4) { width: 15%; }

        .results-table tbody tr:nth-child(even) {
            background: #f9f9f9;
        }
        .results-table tbody tr:hover {
            background: #e8f7f9;
        }

        .state-row td {
            padding: 30px;
            color: #888;
            font-size: 0.95rem;
        }
        .stats {
            margin-top: 10px;
            padding: 8px;
            background: #e8f7f9;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
        }

        footer {
            background: #222;
            color: #aaa;
            text-align: center;
            padding: 16px;
            font-size: 0.8rem;
            margin-top: 20px;
        }
        footer p { margin: 4px 0; }

        @media (max-width: 480px) {
            .results-table th, .results-table td { font-size: 0.78rem; padding: 6px 2px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a class="logo-icon" href="/">🎯</a>
        <a href="/"><h1>Japan Night Teer Result</h1></a>
    </header>

    <div class="page-content">

        <div class="results-table-wrapper">
            <div class="results-title-row">RESULTS</div>
            <div class="table-responsive">
                <table class="results-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th>CITY</th>
                            <th>DATE</th>
                            <th>F/R</th>
                            <th>S/R</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr class="state-row">
                            <td colspan="4">Loading results...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="stats" id="stats"></div>

    </div>

    <footer>
        <p>&copy; Japan Night Teer Result. All rights reserved.</p>
        <p>⚠️ For entertainment purposes only. No guarantee of accuracy.</p>
    </footer>

    <script>
        const API_BASE_URL = 'https://japanteer.onrender.com'; // Update to your Render backend URL

        let allResults = [];
        let filteredResults = [];

        // Helper function to parse date string (DD/MM/YYYY) to timestamp for sorting
        function parseDateToTimestamp(dateStr) {
            if (!dateStr) return 0;
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                return new Date(parts[2], parseInt(parts[1]) - 1, parts[0]).getTime();
            }
            return 0;
        }

        async function loadResults() {
            const tableBody = document.getElementById('resultsTableBody');
            tableBody.innerHTML = `<tr class="state-row"><td colspan="4">Loading results...</td></tr>`;

            try {
                const response = await fetch(`${API_BASE_URL}/api/results`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const data = await response.json();
                console.log('API Response:', data);

                // Extract results from response
                let results = [];
                if (data.data && Array.isArray(data.data)) {
                    results = data.data;
                } else if (Array.isArray(data)) {
                    results = data;
                }

                if (results.length === 0) {
                    tableBody.innerHTML = `<tr class="state-row"><td colspan="4">No results found. Use admin panel to add results.</td></tr>`;
                    document.getElementById('stats').innerHTML = '';
                    return;
                }

                // IMPORTANT: Sort results by date (latest first)
                results.sort((a, b) => {
                    const dateA = parseDateToTimestamp(a.date);
                    const dateB = parseDateToTimestamp(b.date);
                    return dateB - dateA;
                });

                // Store all results
                allResults = results;
                filteredResults = [...allResults];
                
                // Render table
                renderTable();
                updateStats();

            } catch (error) {
                console.error('Error loading results:', error);
                tableBody.innerHTML = `<tr class="state-row"><td colspan="4" style="color:#c00;">
                    ❌ Error loading results. Backend may not be connected.<br>
                    <small>${error.message}</small>
                </td></tr>`;
            }
        }

        function renderTable() {
            const tableBody = document.getElementById('resultsTableBody');
            
            if (filteredResults.length === 0) {
                tableBody.innerHTML = `<tr class="state-row"><td colspan="4">No results match your search.</td></tr>`;
                return;
            }
            
            tableBody.innerHTML = filteredResults.map(result => {
                const resultData = result.data || result;
                const date = result.date || 'Unknown';
                const firstRound = resultData.firstRound || resultData.first_round || '--';
                const secondRound = resultData.secondRound || resultData.second_round || '--';
                
                // Format numbers to 2 digits
                const frFormatted = firstRound.toString().padStart(2, '0');
                const srFormatted = secondRound.toString().padStart(2, '0');
                
                return `
                    <tr>
                        <td>Japan Night</td>
                        <td>${date}</td>
                        <td>${frFormatted}</td>
                        <td>${srFormatted}</td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats() {
            const statsDiv = document.getElementById('stats');
            const totalResults = allResults.length;
            const showingResults = filteredResults.length;
            
            if (showingResults === totalResults) {
                statsDiv.innerHTML = `📊 Showing all ${totalResults} results`;
            } else {
                statsDiv.innerHTML = `📊 Showing ${showingResults} of ${totalResults} results`;
            }
        }

        function filterResults() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const yearFilter = document.getElementById('yearFilter').value;
            
            filteredResults = allResults.filter(result => {
                const date = result.date || '';
                
                // Search filter
                let matchesSearch = true;
                if (searchTerm) {
                    matchesSearch = date.toLowerCase().includes(searchTerm);
                }
                
                // Year filter
                let matchesYear = true;
                if (yearFilter) {
                    matchesYear = date.includes(`/${yearFilter}`);
                }
                
                return matchesSearch && matchesYear;
            });
            
            renderTable();
            updateStats();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('yearFilter').value = '';
            filteredResults = [...allResults];
            renderTable();
            updateStats();
        }

        // Initial load
        loadResults();
        
        // Refresh every 2 minutes
        setInterval(loadResults, 120000);
        // ============ SERVER-SENT EVENTS (SSE) FOR REAL-TIME UPDATES ============
let eventSource = null;
let reconnectAttempts = 0;
const maxReconnectAttempts = 10;

function connectSSE() {
    if (eventSource) {
        eventSource.close();
    }
    
    const backendUrl = 'https://teer-website-1.onrender.com';
    console.log('🔄 Connecting to SSE at:', `${backendUrl}/api/events`);
    
    eventSource = new EventSource(`${backendUrl}/api/events`);
    
    eventSource.onopen = () => {
        console.log('✅ SSE connection established!');
        reconnectAttempts = 0; // Reset reconnect attempts on successful connection
    };
    
    eventSource.onmessage = (event) => {
        console.log('📡 RAW SSE message received:', event.data);
        
        try {
            const data = JSON.parse(event.data);
            console.log('📡 Parsed data:', data);
            console.log('📡 Message type:', data.type);
            
            // Refresh on ANY update type (including common-update)
            if (data.type === 'cache-update' || 
                data.type === 'result-update' || 
                data.type === 'common-update' || 
                data.type === 'dream-update') {
                console.log('🔥 UPDATE DETECTED! Refreshing page NOW...');
                window.location.reload();
            } else if (data.type === 'connected') {
                console.log('✅ Connected to real-time updates');
            } else {
                console.log('📡 Unknown message type:', data.type);
            }
        } catch (e) {
            console.error('Error parsing SSE message:', e);
        }
    };
    
    eventSource.onerror = (error) => {
        console.error('⚠️ SSE error:', error);
        
        // Close the broken connection
        if (eventSource) {
            eventSource.close();
        }
        
        // Attempt to reconnect with exponential backoff
        if (reconnectAttempts < maxReconnectAttempts) {
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
            console.log(`🔄 Reconnecting in ${delay/1000} seconds... (Attempt ${reconnectAttempts + 1}/${maxReconnectAttempts})`);
            reconnectAttempts++;
            setTimeout(connectSSE, delay);
        } else {
            console.log('❌ Max reconnection attempts reached. Please refresh the page manually.');
        }
    };
}

// Start SSE connection when page loads
connectSSE();

// Also check cache version as fallback (every 10 seconds)
let currentCacheVersion = null;

async function checkCacheVersion() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/cache-version`);
        const data = await response.json();
        
        if (currentCacheVersion !== null && currentCacheVersion !== data.version) {
            console.log('🔄 Cache version changed (fallback), refreshing...');
            window.location.reload();
        }
        currentCacheVersion = data.version;
    } catch (error) {
        console.log('Cache check failed:', error.message);
    }
}

// Fallback: Check every 10 seconds (in case SSE fails)
setInterval(checkCacheVersion, 10000);
checkCacheVersion();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
