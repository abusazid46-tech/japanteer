<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Numbers - Japan Teer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f5f0eb;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .site-header {
            background: linear-gradient(90deg, #1a8fa0 0%, #16b0c8 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .site-header .logo-icon {
    width: 44px; height: 44px;
    background: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    overflow: hidden;
    padding: 6px;
}
.site-header .logo-icon img {
    width: 100%; height: 100%;
    object-fit: contain;
}
        .site-header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 1px;
            margin: 0;
        }
        .site-header a { text-decoration: none; }

        /* ── PAGE CONTENT ── */
        .page-content {
            flex: 1;
            padding: 20px 12px 30px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── SUBTITLE ── */
        .subtitle {
            text-align: center;
            font-style: italic;
            font-size: 0.92rem;
            color: #444;
            margin-bottom: 16px;
        }

        /* ── EXCEL TABLE ── */
        .dreams-table-wrapper {
            border: 1px solid #aaa;
            border-radius: 3px;
            overflow-x: auto;
            background: #fff;
        }

        .dreams-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Roboto', sans-serif;
            font-size: 0.88rem;
            min-width: 560px;
        }

        .dreams-table th,
        .dreams-table td {
            border: 1px solid #bbb;
            padding: 6px 8px;
            vertical-align: middle;
        }

        /* Header row - light blue like reference image */
        .dreams-table thead th {
            background: #7dd6e8;
            color: #111;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            border-color: #aaa;
            white-space: nowrap;
        }

        /* Column widths */
        .dreams-table th:nth-child(1),
        .dreams-table td:nth-child(1) { width: 48px; text-align: center; }
        .dreams-table th:nth-child(2),
        .dreams-table td:nth-child(2) { width: 28%; text-align: left; }
        .dreams-table th:nth-child(3),
        .dreams-table td:nth-child(3) { text-align: left; }
        .dreams-table th:nth-child(4),
        .dreams-table td:nth-child(4) { width: 72px; text-align: center; }
        .dreams-table th:nth-child(5),
        .dreams-table td:nth-child(5) { width: 72px; text-align: center; }

        .dreams-table tbody tr:nth-child(even) { background: #f7f7f7; }
        .dreams-table tbody tr:hover { background: #e6f7fa; }
        .dreams-table tbody td { color: #222; }

        .state-row td {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 0.95rem;
        }

        /* ── FOOTER ── */
        footer {
            background: #5baec8;
            color: #fff;
            text-align: center;
            padding: 14px 16px;
            font-size: 0.82rem;
            margin-top: auto;
        }
        footer p { margin: 3px 0; }
        footer a { color: #1a2a6c; text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 540px) {
            .dreams-table { font-size: 0.78rem; }
            .dreams-table th, .dreams-table td { padding: 5px 5px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="logo-icon"><img src="logo.png" alt="Japan Night Teer Logo"></div>
        <a href="/"><h1>Japan Teer</h1></a>
    </header>

    <!-- CONTENT -->
    <div class="page-content">

        <p class="subtitle">Below is a compilation of dream meanings.</p>

        <div class="dreams-table-wrapper">
            <table class="dreams-table">
                <thead>
                    <tr>
                        <th>Sl.no</th>
                        <th>Dream</th>
                        <th>Direct</th>
                        <th>House</th>
                        <th>Ending</th>
                    </tr>
                </thead>
                <tbody id="dreamsTable">
                    <tr class="state-row">
                        <td colspan="5">Loading dreams...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>All rights Reserved. Japan Teer.</p>
        <p><a href="#">Terms</a> | <a href="#">Contact</a> | <a href="#">Privacy Policy</a></p>
    </footer>

    <script>
        const API_BASE_URL = 'https://japanteer.onrender.com';
        let allDreams = [];

        function renderDreams(dreams) {
            const tbody = document.getElementById('dreamsTable');
            if (!dreams || dreams.length === 0) {
                tbody.innerHTML = `<tr class="state-row"><td colspan="5">No dreams found. Try a different keyword.</td></tr>`;
                return;
            }
            tbody.innerHTML = dreams.map((dream, idx) => {
                const d = dream.data || dream;
                const slNo   = d.slNo || d.sl_no || (idx + 1);
                const name   = d.dream || d.name || 'Unknown';
                const direct = d.direct  ? String(d.direct)  : '';
                const house  = d.house   ? String(d.house)   : '';
                const ending = d.ending  ? String(d.ending)  : '';
                return `<tr>
                    <td>${slNo}</td>
                    <td>${name}</td>
                    <td>${direct}</td>
                    <td>${house}</td>
                    <td>${ending}</td>
                </tr>`;
            }).join('');
        }

        async function loadDreams(searchTerm = '') {
            const tbody = document.getElementById('dreamsTable');
            tbody.innerHTML = `<tr class="state-row"><td colspan="5">Loading dreams...</td></tr>`;
            try {
                const url = searchTerm.trim()
                    ? `${API_BASE_URL}/api/search-dream?q=${encodeURIComponent(searchTerm)}`
                    : `${API_BASE_URL}/api/dreams`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                let dreams = [];
                if (data.data && Array.isArray(data.data))         dreams = data.data;
                else if (Array.isArray(data))                       dreams = data;
                else if (data.dreams && Array.isArray(data.dreams)) dreams = data.dreams;

                allDreams = dreams;
                renderDreams(dreams);
            } catch (e) {
                tbody.innerHTML = `<tr class="state-row"><td colspan="5" style="color:#c00;">
                    ❌ Error loading dreams. Backend may not be connected.<br>
                    <small>${e.message}</small>
                </td></tr>`;
            }
        }

        loadDreams();
        setInterval(() => { loadDreams(); }, 300000);
        // ============ SERVER-SENT EVENTS (SSE) FOR REAL-TIME UPDATES ============
let eventSource = null;
let reconnectAttempts = 0;
const maxReconnectAttempts = 10;

function connectSSE() {
    if (eventSource) {
        eventSource.close();
    }
    
    const backendUrl = 'https://teer-website-1.onrender.com';
    console.log('🔄 Connecting to SSE at:', `${backendUrl}/api/events`);
    
    eventSource = new EventSource(`${backendUrl}/api/events`);
    
    eventSource.onopen = () => {
        console.log('✅ SSE connection established!');
        reconnectAttempts = 0; // Reset reconnect attempts on successful connection
    };
    
    eventSource.onmessage = (event) => {
        console.log('📡 RAW SSE message received:', event.data);
        
        try {
            const data = JSON.parse(event.data);
            console.log('📡 Parsed data:', data);
            console.log('📡 Message type:', data.type);
            
            // Refresh on ANY update type (including common-update)
            if (data.type === 'cache-update' || 
                data.type === 'result-update' || 
                data.type === 'common-update' || 
                data.type === 'dream-update') {
                console.log('🔥 UPDATE DETECTED! Refreshing page NOW...');
                window.location.reload();
            } else if (data.type === 'connected') {
                console.log('✅ Connected to real-time updates');
            } else {
                console.log('📡 Unknown message type:', data.type);
            }
        } catch (e) {
            console.error('Error parsing SSE message:', e);
        }
    };
    
    eventSource.onerror = (error) => {
        console.error('⚠️ SSE error:', error);
        
        // Close the broken connection
        if (eventSource) {
            eventSource.close();
        }
        
        // Attempt to reconnect with exponential backoff
        if (reconnectAttempts < maxReconnectAttempts) {
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
            console.log(`🔄 Reconnecting in ${delay/1000} seconds... (Attempt ${reconnectAttempts + 1}/${maxReconnectAttempts})`);
            reconnectAttempts++;
            setTimeout(connectSSE, delay);
        } else {
            console.log('❌ Max reconnection attempts reached. Please refresh the page manually.');
        }
    };
}

// Start SSE connection when page loads
connectSSE();

// Also check cache version as fallback (every 10 seconds)
let currentCacheVersion = null;

async function checkCacheVersion() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/cache-version`);
        const data = await response.json();
        
        if (currentCacheVersion !== null && currentCacheVersion !== data.version) {
            console.log('🔄 Cache version changed (fallback), refreshing...');
            window.location.reload();
        }
        currentCacheVersion = data.version;
    } catch (error) {
        console.log('Cache check failed:', error.message);
    }
}

// Fallback: Check every 10 seconds (in case SSE fails)
setInterval(checkCacheVersion, 10000);
checkCacheVersion();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
